name: secrets-guard-parity

# Gate the shared secret-leak-guard codebase: the core must match the canonical
# bash reference, and every adapter (Claude CLI, OpenCode plugin, pi extension)
# must match the core, across the full case battery.

on:
  push:
    branches: [main]
    paths: ["secrets-guard/**", ".github/workflows/secrets-guard-parity.yml"]
  pull_request:
    paths: ["secrets-guard/**", ".github/workflows/secrets-guard-parity.yml"]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard parity (core == bash reference; all adapters == core)
        run: node --experimental-strip-types secrets-guard/tests/parity.mjs
